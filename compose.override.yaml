# Desenvolvimento local: carregado automaticamente por `docker compose` (sem -f).
services:
  nginx:
    ports:
      - "${GS_HTTP_PORT:-80}:80"

  # Runner local (subprocesso, sem sandbox): só existe fora de produção. O executor roda no
  # container do worker, daí o `init` que colhe os órfãos; a manutenção consulta e para esses
  # executores pelo grupo de processos, daí o namespace de PIDs e a área de trabalho do worker.
  worker:
    init: true
    environment:
      GS_RUNNER: local
      GS_WORK_ROOT: /var/lib/goblinshift/work
    volumes: ["work:/var/lib/goblinshift/work"]

  maintenance:
    pid: "service:worker"
    environment:
      GS_RUNNER: local
      GS_WORK_ROOT: /var/lib/goblinshift/work
    volumes: ["work:/var/lib/goblinshift/work"]
    depends_on:
      worker:
        condition: service_started

volumes:
  work:
