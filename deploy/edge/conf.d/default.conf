# Resolve os nomes dos projetos na rede `edge` em tempo de requisição, para que o proxy
# suba mesmo com um projeto parado (proxy_pass com variável + resolver do Docker).
resolver 127.0.0.11 valid=10s ipv6=off;

# Os tetos de corpo ficam no Nginx de cada projeto; a borda só não pode ser menor.
client_max_body_size 256m;
proxy_request_buffering off;
server_tokens off;

# Enquanto não houver domínios, o acesso pelo IP vai para o GoblinShift.
# Com domínios, cada projeto ganha seu próprio server { server_name …; } e o TLS.
server {
    listen 80 default_server;

    location / {
        set $upstream http://goblinshift-web;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        # Primeiro salto voltado para a internet: substitui o que o cliente enviou.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
