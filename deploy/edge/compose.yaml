# Proxy de borda do host (docs/GoblinShiftPlan.md, ADR 014). Não pertence a nenhum projeto:
# ouve nas portas 80/443 e encaminha por domínio para o ponto de entrada de cada projeto,
# na rede Docker compartilhada `edge`. Instalado em /srv/edge por deploy/provision.sh.
name: edge

services:
  proxy:
    image: nginx:1.30.5
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    networks:
      edge:
        # IP fixo: os projetos confiam nos cabeçalhos X-Forwarded-* só vindos daqui,
        # não de qualquer container da rede compartilhada.
        ipv4_address: 172.31.0.2
    restart: unless-stopped

networks:
  edge:
    name: edge
    ipam:
      config:
        - subnet: 172.31.0.0/24
