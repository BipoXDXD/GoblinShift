# Produção na VPS compartilhada (docs/GoblinShiftPlan.md, 3.8 e ADR 014).
# O Nginx do GoblinShift entra na rede `edge` no IP reservado a ele, que o trecho do projeto
# na borda (deploy/edge/conf.d/goblinshift.caddy) usa. Nenhuma porta é publicada pelo projeto.
#
# Executor (fatia 4): o worker e a manutenção falam com o executor-ctl do host pelo socket em
# /run/goblinshift (grupo gs-exec, GID 61001) e preparam a área de trabalho no filesystem de
# tamanho fixo /srv/goblinshift/exec-work. Nenhum serviço monta o socket do Docker. A imagem do
# executor (por digest) vem do deploy/release.sh, a mesma para a API, que a fixa na Run.
x-executor-env: &executor-env
  GS_RUNNER: executor_ctl
  GS_EXECUTOR_IMAGE: ${GS_EXECUTOR_IMAGE:?exportada pelo deploy/release.sh (imagem do executor por digest)}

# Sem `create_host_path`: se o executor-ctl ou o filesystem da área não estiverem instalados, o
# container não sobe, em vez de o Docker criar diretórios vazios no lugar deles.
x-executor-client: &executor-client
  group_add: ["61001"]
  volumes:
    - type: bind
      source: /run/goblinshift
      target: /run/goblinshift
      bind: {create_host_path: false}
    - type: bind
      source: /srv/goblinshift/exec-work
      target: /var/lib/goblinshift/exec-work
      bind: {create_host_path: false}

services:
  api:
    environment:
      <<: *executor-env
      GS_CURSOR_SECRET: ${GS_CURSOR_SECRET:?gerado pelo deploy/release.sh em secrets/app.env}
      GS_USER_HASH_SECRET: ${GS_USER_HASH_SECRET:?gerado pelo deploy/release.sh em secrets/app.env}
      # Login web (fatia 6, 3.6), só na API. Sem uma destas, o Compose recusa o arquivo antes de
      # qualquer comando, e o deploy para antes do `migrate`, sem mexer no banco.
      GS_PUBLIC_ORIGIN: ${GS_PUBLIC_ORIGIN:?defina em secrets/app.env (https://goblinshift.dev)}
      GS_GOOGLE_CLIENT_ID: ${GS_GOOGLE_CLIENT_ID:?defina em secrets/app.env (console do Google)}
      GS_GITHUB_CLIENT_ID: ${GS_GITHUB_CLIENT_ID:?defina em secrets/app.env (OAuth App do GitHub)}
      # Fechado até a abertura pública (ADR 023).
      GS_SIGNUP_MODE: ${GS_SIGNUP_MODE:-closed}
      GS_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GS_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      GS_CSRF_SECRET_FILE: /run/secrets/csrf_secret
      GS_LOGIN_COOKIE_SECRET_FILE: /run/secrets/login_cookie_secret
    # Somados ao db_password da base (o Compose funde as listas pelo nome).
    secrets:
      - google_client_secret
      - github_client_secret
      - csrf_secret
      - login_cookie_secret
  # O evento de término da Run (3.7) sai do worker e da manutenção com o mesmo `user.hash` da API.
  worker:
    <<: *executor-client
    environment:
      <<: *executor-env
      GS_WORK_ROOT: /var/lib/goblinshift/exec-work
      GS_USER_HASH_SECRET: ${GS_USER_HASH_SECRET:?gerado pelo deploy/release.sh em secrets/app.env}
  maintenance:
    <<: *executor-client
    environment:
      <<: *executor-env
      GS_WORK_ROOT: /var/lib/goblinshift/exec-work
      GS_USER_HASH_SECRET: ${GS_USER_HASH_SECRET:?gerado pelo deploy/release.sh em secrets/app.env}
  # Ocupação dos filesystems de tamanho fixo para o alerta de disco acima de 85% (3.7 e
  # docker/otel-collector/config.yaml). Só leitura: o Collector só precisa do statfs.
  otel-collector:
    volumes:
      - type: bind
        source: /srv/goblinshift/pg
        target: /hostfs/pg
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/goblinshift/storage
        target: /hostfs/storage
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/goblinshift/telemetry
        target: /hostfs/telemetry
        read_only: true
        bind: {create_host_path: false}
  nginx:
    # Sem NET_RAW: um container comprometido na rede edge não forja ARP para assumir o IP da
    # borda, em quem os projetos confiam (ADR 014).
    cap_drop: [NET_RAW]
    networks:
      internal: {}
      edge:
        # IP, e não alias: com o mesmo alias, outro container dividiria o tráfego em
        # silêncio; com o mesmo IP, o Docker recusa.
        ipv4_address: 172.31.0.4

# Arquivos em /srv/goblinshift/secrets (diretório 700), modo 644 como o db_password: a API lê com
# o próprio UID. Os client secrets são gravados pelo operador; as chaves do servidor, geradas pelo
# deploy/app-secrets.sh (README, "Segredos do login").
secrets:
  google_client_secret:
    file: ${GS_SECRETS_DIR:?exportado pelo deploy/compose.sh}/google_client_secret
  github_client_secret:
    file: ${GS_SECRETS_DIR:?exportado pelo deploy/compose.sh}/github_client_secret
  csrf_secret:
    file: ${GS_SECRETS_DIR:?exportado pelo deploy/compose.sh}/csrf_secret
  login_cookie_secret:
    file: ${GS_SECRETS_DIR:?exportado pelo deploy/compose.sh}/login_cookie_secret

networks:
  edge:
    external: true
