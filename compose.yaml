# Serviços do GoblinShift (docs/GoblinShiftPlan.md, 3.8).
# Local:    ./scripts/dev-secrets.sh && docker compose up --build   (carrega compose.override.yaml)
# Produção: docker compose -f compose.yaml -f compose.prod.yaml …    (ver deploy/coolify/README.md)
# Esta base não publica portas: em produção o tráfego chega pelo proxy de borda do host.

name: goblinshift

# Rotação por serviço (docs/GoblinShiftPlan.md, 1.7 e 3.8): até 50 MiB por serviço, dimensionado
# para cobrir 14 dias no volume previsto. Fica aqui, e não no /etc/docker/daemon.json, porque a
# VPS é compartilhada e o daemon.json vale para os containers de todos os projetos.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  image: ghcr.io/bipoxdxd/goblinshift:${GS_IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    args:
      GS_SERVICE_VERSION: ${GS_IMAGE_TAG:-dev}
  environment: &app-env
    GS_ENVIRONMENT: ${GS_ENVIRONMENT:-development}
    GS_DB_HOST: postgres
    GS_DB_PASSWORD_FILE: /run/secrets/db_password
    OTEL_SERVICE_NAME: goblinshift-api
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # Confia em X-Forwarded-* só do Nginx interno (rede própria) e do proxy de borda (IP
    # fixo). Outros containers da rede compartilhada `edge` não são confiáveis.
    FORWARDED_ALLOW_IPS: 172.30.0.0/24,172.31.0.2
  secrets: [db_password]
  networks: [internal]
  logging: *logging

# Menor privilégio (issue #366) nos serviços que rodam como UID 10001: um processo sem root já não
# tem capability efetiva; sem nenhuma no conjunto limite e com no-new-privileges, nem um binário
# setuid as devolve. Fora do x-app: storage-init e storage-mark rodam como root e precisam de CHOWN.
x-least-privilege: &least-privilege
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# Storage privado (docs/GoblinShiftPlan.md, 3.6): local num volume; na VPS, o filesystem de
# tamanho fixo /srv/goblinshift/storage.
x-storage: &storage
  ${GS_STORAGE_DATA:-storage}:/var/lib/goblinshift/storage

services:
  postgres:
    image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_DB: goblinshift
      POSTGRES_USER: goblinshift
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - ${GS_PG_DATA:-pgdata}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goblinshift -d goblinshift"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Cria a pasta dos objetos com o dono do usuário da aplicação: na VPS o storage é um
  # filesystem montado pelo root, e a aplicação não roda como root.
  storage-init:
    <<: *app
    user: "0"
    command: ["install", "-d", "-o", "app", "-g", "app", "-m", "700", "/var/lib/goblinshift/storage/objects"]
    volumes: [*storage]
    restart: "no"

  # Sentinela de montagem (files/storage.py, MOUNT_MARKER): sem ela a manutenção não marca objeto
  # nenhum como `missing`. Fora do `up` (perfil próprio), para um `up` com o filesystem
  # desmontado não a recriar no disco do sistema: na VPS, só pelo deploy/storage-mark.sh, que
  # confere a montagem antes. No desenvolvimento: `docker compose run --rm storage-mark`.
  storage-mark:
    <<: *app
    user: "0"
    profiles: [storage-mark]
    command: ["install", "-m", "644", "/dev/null", "/var/lib/goblinshift/storage/objects/.goblinshift-storage"]
    volumes: [*storage]
    restart: "no"

  api:
    <<: [*app, *least-privilege]
    environment:
      <<: *app-env
      GS_STORAGE_ROOT: /var/lib/goblinshift/storage/objects
    volumes: [*storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Worker e manutenção (3.4). O Runner e o que ele exige do container ficam em cada ambiente:
  # o local (subprocesso, só desenvolvimento) em compose.override.yaml; o executor-ctl
  # (container gVisor por tentativa, criado pelo serviço do host) em compose.prod.yaml.
  worker:
    <<: [*app, *least-privilege]
    command: ["gs-worker"]
    environment: &worker-env
      <<: *app-env
      GS_STORAGE_ROOT: /var/lib/goblinshift/storage/objects
      OTEL_SERVICE_NAME: goblinshift-worker
    volumes: [*storage]
    depends_on: &worker-deps
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    # O SIGTERM não interrompe a tentativa em curso. Este prazo é menor que o teto dela (10 min):
    # a que não terminar a tempo leva SIGKILL e volta pelo lease vencido.
    stop_grace_period: 30s
    restart: unless-stopped

  maintenance:
    <<: [*app, *least-privilege]
    command: ["gs-maintenance"]
    environment:
      <<: *worker-env
      OTEL_SERVICE_NAME: goblinshift-maintenance
      # Sem valor: só repassa o da shell, para o administrador desligar o limitador de ausentes
      # depois de restaurar de propósito um backup antigo (deploy/openobserve/README.md).
      GS_MISSING_SWEEP_MAX_ABSENT_RATIO:
    volumes: [*storage]
    depends_on: *worker-deps
    # A volta para entre os passos, e um passo pode esperar o prazo de uma chamada ao executor-ctl
    # (a sonda da imagem, 10 s) antes do prazo do tracing: a carência padrão de 10 s não cabe.
    stop_grace_period: 30s
    restart: unless-stopped

  # Nginx com o build da SPA e a própria configuração (docker/web.Dockerfile).
  nginx:
    image: ghcr.io/bipoxdxd/goblinshift-web:${GS_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      GS_DOMAIN: ${GS_DOMAIN:-_}
    # A imagem oficial sobe o mestre como root. Ficam só as capabilities medidas com ela
    # (tests/test_container_hardening.py): CHOWN para as pastas temporárias do usuário `nginx`,
    # SETUID e SETGID para os workers trocarem de usuário e NET_BIND_SERVICE para a porta 80,
    # que só abre sem ela se o daemon do host baixar `ip_unprivileged_port_start`. Lista
    # explícita, e não ALL mais cap_add: a política do host (ADR 034) reprova cap_add.
    cap_drop:
      - AUDIT_WRITE
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OPENOBSERVE_BASIC_AUTH: ${OPENOBSERVE_BASIC_AUTH:?defina em .env (scripts/dev-secrets.sh)}
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      openobserve:
        condition: service_started
    # IP fixo (ADR 051, C1): o Nginx manda o access log por syslog para um IP, sem DNS. Igual
    # ao de deploy/coolify/infra.json. O IP só fica reservado com o Collector de pé: parado, um
    # container dinâmico pode pegá-lo, e aí o Collector não sobe (Address already in use; o
    # roteiro do deploy manda abortar).
    networks:
      internal:
        ipv4_address: 172.30.0.250
    restart: unless-stopped
    logging: *logging

  openobserve:
    image: openobserve/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
    environment:
      ZO_LOCAL_MODE: "true"
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: "30"
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:?defina em .env (scripts/dev-secrets.sh)}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?defina em .env (scripts/dev-secrets.sh)}
    volumes:
      - ${GS_TELEMETRY_DATA:-telemetry}:/data
    # Só localhost: acesso por túnel SSH (ssh -L 5080:127.0.0.1:5080 …).
    ports:
      - "127.0.0.1:${GS_OPENOBSERVE_PORT:-5080}:5080"
    networks: [internal]
    restart: unless-stopped
    logging: *logging

secrets:
  db_password:
    file: ${GS_SECRETS_DIR:-./.secrets}/db_password

volumes:
  pgdata:
  telemetry:
  storage:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
