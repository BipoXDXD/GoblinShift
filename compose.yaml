# Serviços do GoblinShift (docs/GoblinShiftPlan.md, 3.8).
# Local:    ./scripts/dev-secrets.sh && docker compose up --build   (carrega compose.override.yaml)
# Produção: docker compose -f compose.yaml -f compose.prod.yaml …    (ver deploy/deploy.sh)
# Esta base não publica portas: em produção o tráfego chega pelo proxy de borda do host.

name: goblinshift

# Rotação por serviço (docs/GoblinShiftPlan.md, 1.7 e 3.8): até 50 MiB por serviço, dimensionado
# para cobrir 14 dias no volume previsto. Fica aqui, e não no /etc/docker/daemon.json, porque a
# VPS é compartilhada e o daemon.json vale para os containers de todos os projetos.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  image: ghcr.io/bipoxdxd/goblinshift:${GS_IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    args:
      GS_SERVICE_VERSION: ${GS_IMAGE_TAG:-dev}
  environment: &app-env
    GS_ENVIRONMENT: ${GS_ENVIRONMENT:-development}
    GS_DB_HOST: postgres
    GS_DB_PASSWORD_FILE: /run/secrets/db_password
    OTEL_SERVICE_NAME: goblinshift-api
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # Confia em X-Forwarded-* só do Nginx interno (rede própria) e do proxy de borda (IP
    # fixo). Outros containers da rede compartilhada `edge` não são confiáveis.
    FORWARDED_ALLOW_IPS: 172.30.0.0/24,172.31.0.2
  secrets: [db_password]
  networks: [internal]
  logging: *logging

# Storage privado (docs/GoblinShiftPlan.md, 3.6): local num volume; na VPS, o filesystem de
# tamanho fixo /srv/goblinshift/storage (deploy/release.sh).
x-storage: &storage
  ${GS_STORAGE_DATA:-storage}:/var/lib/goblinshift/storage

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: goblinshift
      POSTGRES_USER: goblinshift
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - ${GS_PG_DATA:-pgdata}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goblinshift -d goblinshift"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Cria a pasta dos objetos com o dono do usuário da aplicação: na VPS o storage é um
  # filesystem montado pelo root, e a aplicação não roda como root.
  storage-init:
    <<: *app
    user: "0"
    command: ["install", "-d", "-o", "app", "-g", "app", "-m", "700", "/var/lib/goblinshift/storage/objects"]
    volumes: [*storage]
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *app-env
      GS_STORAGE_ROOT: /var/lib/goblinshift/storage/objects
    volumes: [*storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Worker e manutenção (3.4). O Runner e o que ele exige do container ficam em cada ambiente:
  # o local (subprocesso, só desenvolvimento) em compose.override.yaml; o executor-ctl
  # (container gVisor por tentativa, criado pelo serviço do host) em compose.prod.yaml.
  worker:
    <<: *app
    command: ["gs-worker"]
    environment: &worker-env
      <<: *app-env
      GS_STORAGE_ROOT: /var/lib/goblinshift/storage/objects
      OTEL_SERVICE_NAME: goblinshift-worker
    volumes: [*storage]
    depends_on: &worker-deps
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    # Mais que o prazo de parada do executor (10 s) para a tentativa em curso encerrar.
    stop_grace_period: 30s
    restart: unless-stopped

  maintenance:
    <<: *app
    command: ["gs-maintenance"]
    environment:
      <<: *worker-env
      OTEL_SERVICE_NAME: goblinshift-maintenance
    volumes: [*storage]
    depends_on: *worker-deps
    restart: unless-stopped

  nginx:
    image: nginx:1.30.5
    environment:
      GS_DOMAIN: ${GS_DOMAIN:-_}
      NGINX_ENVSUBST_FILTER: ^GS_
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OPENOBSERVE_BASIC_AUTH: ${OPENOBSERVE_BASIC_AUTH:?defina em .env (scripts/dev-secrets.sh)}
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      openobserve:
        condition: service_started
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  openobserve:
    image: openobserve/openobserve:v1.0.4
    environment:
      ZO_LOCAL_MODE: "true"
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: "30"
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:?defina em .env (scripts/dev-secrets.sh)}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?defina em .env (scripts/dev-secrets.sh)}
    volumes:
      - ${GS_TELEMETRY_DATA:-telemetry}:/data
    # Só localhost: acesso por túnel SSH (ssh -L 5080:127.0.0.1:5080 …).
    ports:
      - "127.0.0.1:${GS_OPENOBSERVE_PORT:-5080}:5080"
    networks: [internal]
    restart: unless-stopped
    logging: *logging

secrets:
  db_password:
    file: ${GS_SECRETS_DIR:-./.secrets}/db_password

volumes:
  pgdata:
  telemetry:
  storage:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
