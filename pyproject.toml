[project]
name = "goblinshift"
version = "0.1.0"
description = "API de processamento de arquivos por receitas, com resultados privados e manifesto."
authors = [{ name = "BipoXDXD" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.6.12",
    "fastapi>=0.121",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pillow==12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gs-admin = "goblinshift.entrypoints.admin_cli:main"
gs-csv-janitor = "goblinshift.entrypoints.csv_janitor_cli:main"
gs-export-openapi = "goblinshift.entrypoints.openapi_export:main"
gs-maintenance = "goblinshift.entrypoints.maintenance:main"
gs-worker = "goblinshift.entrypoints.worker:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# Única dependência de terceiros da imagem do executor (ADR 018): o Dockerfile instala só este
# grupo, a partir do lock. O pin repete o de [project.dependencies]; um teste confere os dois.
executor = ["pillow==12.3.0"]
# Teste de contrato (scripts/contract-test.sh, job "Contrato" do CI). Fora do `dev` para não
# pesar na sincronização dos outros jobs; versão exata porque cada release muda as heurísticas e
# um CI vermelho tem de vir de mudança na API, não do fuzzer.
contract = ["schemathesis==4.31.0"]
dev = [
    "hypothesis>=6.169.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.per-file-target-version]
# Rodam no Python do host (3.12 no Ubuntu 24.04), fora da imagem da aplicação.
"deploy/executor_ctl/**" = "py312"
"deploy/acceptance/**" = "py312"
"deploy/backup/**" = "py312"
"deploy/openobserve/**" = "py312"
"deploy/tls_check/**" = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
# Pacotes do host em deploy/, importados pelos testes via pythonpath.
known-first-party = ["executor_ctl", "openobserve", "tls_check"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# O teste de aceitação chama o CLI do Docker com argumentos montados no próprio código, sem shell.
"deploy/acceptance/**" = ["S603", "S607"]
# O executor-ctl só fala com o Docker pelo CLI, com a lista de argumentos montada no código
# (perfil fixo) e sem shell; nada vindo do cliente vira opção.
"deploy/executor_ctl/**" = ["S603", "S607"]
# Os testes de integração do executor-ctl conferem o Docker pelo mesmo CLI, sem shell.
"tests/executor_ctl/**" = ["S101", "S603", "S607"]
# Os testes do backup rodam os scripts reais, o curl, o age e o Docker pelo CLI, sem shell.
"tests/backup/**" = ["S101", "S603", "S607"]
# Os testes dos SLOs montam SQL de consulta ao OpenObserve com nomes de stream gerados por eles.
"tests/openobserve/**" = ["S101", "S608"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations", "deploy", "scripts"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# O Schemathesis só existe no grupo `contract` (job "Contrato"); o mypy roda no ambiente `dev`.
# Pulá-lo sempre dá o mesmo resultado com ou sem o grupo instalado. O adaptador que o importa é
# fino e roda no próprio job; as regras que ele aplica (scripts/contract_rules.py) são tipadas.
[[tool.mypy.overrides]]
module = ["schemathesis", "schemathesis.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["scripts.contract_hooks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# O Schemathesis (grupo `contract`) registra um plugin do pytest ao ser instalado no mesmo
# ambiente; a suíte não o usa, e sem ele ela roda igual com ou sem o grupo.
addopts = "-ra --strict-markers -p no:schemathesis"
# O executor-ctl é um pacote do host em deploy/, fora de src/ (roda no Python do sistema).
pythonpath = ["deploy"]
# Aviso é erro: uma depreciação nova reprova a suíte em vez de passar despercebida.
filterwarnings = ["error"]
markers = [
    "integration: precisa de Docker (PostgreSQL real via Testcontainers)",
    "executor_image: constrói e roda a imagem do executor (precisa de Docker; runtime em GS_TEST_RUNTIME)",
    "executor_ctl: executor-ctl com Docker real (runtime em GS_TEST_RUNTIME, padrão runc)",
    "nginx_image: constrói e sobe a imagem do Nginx com a SPA (docker/web.Dockerfile; precisa de Docker)",
    "nginx: Nginx real com os templates do repositório (precisa de Docker)",
    "backup: backup e restauração do PostgreSQL contra S3 local (precisa de Docker, age e curl)",
    "openobserve: SLOs e alertas contra OpenObserve e Collector reais (precisa de Docker)",
    "host_installer: instaladores de deploy/ como root num container Debian (precisa de Docker)",
]

# Fitness functions da arquitetura (docs/GoblinShiftPlan.md, seção 3.2).
[tool.importlinter]
root_package = "goblinshift"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas: entrypoints → runs → presets → (catalog | files | identity) → capacity → (processing | platform)"
type = "layers"
# `capacity` (livro-razão de reservas, ADR 024) fica abaixo de `files` e `runs`, que reservam, e
# acima de `platform`, de onde vem o MetaData.
layers = [
    "goblinshift.entrypoints",
    "goblinshift.runs",
    "goblinshift.presets",
    "goblinshift.catalog | goblinshift.files | goblinshift.identity",
    "goblinshift.capacity",
    "goblinshift.processing | goblinshift.platform",
]

[[tool.importlinter.contracts]]
name = "processing não depende de banco, web nem de outros módulos do projeto"
type = "forbidden"
source_modules = ["goblinshift.processing"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "starlette",
    "httpx",
    "httpx2",
    "goblinshift.platform",
    "goblinshift.capacity",
    "goblinshift.catalog",
    "goblinshift.files",
    "goblinshift.identity",
    "goblinshift.presets",
    "goblinshift.runs",
    "goblinshift.entrypoints",
]

[[tool.importlinter.contracts]]
name = "runs.lifecycle é função pura: sem banco, web nem outros módulos do projeto"
type = "forbidden"
source_modules = ["goblinshift.runs.lifecycle"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "starlette",
    "httpx",
    "httpx2",
    "goblinshift.platform",
    "goblinshift.capacity",
    "goblinshift.catalog",
    "goblinshift.files",
    "goblinshift.identity",
    "goblinshift.presets",
    "goblinshift.processing",
    "goblinshift.entrypoints",
]

# Fatia 5 (etapa 0): o Pillow só existe para as receitas do executor. API, worker e manutenção não
# decodificam imagem; carregá-lo neles só aumentaria superfície de ataque e memória. É isto que
# obriga os __init__ de processing.image_forge e processing.executor a não importarem o PIL de
# forma ansiosa (o catálogo importa os parâmetros do Image Forge; o worker, constantes do executor).
[[tool.importlinter.contracts]]
name = "Só o executor carrega o PIL"
type = "forbidden"
source_modules = [
    "goblinshift.catalog",
    "goblinshift.files",
    "goblinshift.runs",
    "goblinshift.presets",
    "goblinshift.identity",
    "goblinshift.capacity",
    "goblinshift.platform",
    "goblinshift.entrypoints",
]
forbidden_modules = ["PIL"]
allow_indirect_imports = false

# Cada receita é uma unidade de versão própria (1.6): mudar uma não pode mudar o comportamento de
# outra. O que for comum vai para processing (names.py, output_dir.py), não de uma receita à outra.
[[tool.importlinter.contracts]]
name = "Receitas não importam umas às outras"
type = "independence"
modules = [
    "goblinshift.processing.csv_janitor",
    "goblinshift.processing.image_forge",
    "goblinshift.processing.downloads_detox",
    "goblinshift.processing.media_mill",
]

# 3.2: o pacote (manifesto e ZIP) é montado uma vez, pelo executor, depois da receita. Uma receita
# que montasse ZIP escaparia do determinismo e dos tetos do empacotador comum.
[[tool.importlinter.contracts]]
name = "Receitas não empacotam"
type = "forbidden"
source_modules = [
    "goblinshift.processing.csv_janitor",
    "goblinshift.processing.image_forge",
    "goblinshift.processing.downloads_detox",
    "goblinshift.processing.media_mill",
]
forbidden_modules = ["goblinshift.processing.packaging", "zipfile"]

# ADR 036: o FFmpeg processa conteúdo do usuário e só roda dentro do sandbox. API, worker e
# manutenção importam os parâmetros e limites do Media Mill (pelo catálogo), nunca o módulo que
# abre processos; o `__init__` de processing.media_mill não importa `tools` nem `recipe`.
[[tool.importlinter.contracts]]
name = "Só o executor roda o FFmpeg"
type = "forbidden"
source_modules = [
    "goblinshift.catalog",
    "goblinshift.files",
    "goblinshift.runs",
    "goblinshift.presets",
    "goblinshift.identity",
    "goblinshift.capacity",
    "goblinshift.platform",
    "goblinshift.entrypoints",
]
forbidden_modules = [
    "goblinshift.processing.media_mill.tools",
    "goblinshift.processing.media_mill.recipe",
]
allow_indirect_imports = false
