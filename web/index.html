<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoblinShift</title>
    <meta name="description" content="Arquivos em lote, limpos pelos goblins da oficina." />
    <!-- O .ico só para navegador sem SVG: o sizes impede o Chrome de preferi-lo ao SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Compartilhamento: os robôs não resolvem caminho relativo, então a imagem vai com o domínio. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GoblinShift" />
    <meta property="og:title" content="GoblinShift" />
    <meta property="og:description" content="Arquivos em lote, limpos pelos goblins da oficina." />
    <meta property="og:url" content="https://goblinshift.dev/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://goblinshift.dev/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Selo da oficina GoblinShift: a goblin Rúbia, de maria-chiquinhas vermelhas, com uma chave inglesa no ombro."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Antes de qualquer CSS: grava data-theme no <html> para a primeira pintura sair no tema certo. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
