version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # @types/node acompanha a major do Node em web/.nvmrc (hoje 24); a major sobe junto com o
      # runtime, à mão, senão os tipos prometem APIs que o Node da CI e da imagem não têm.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # O TypeScript 7.0 não exporta a API de compilador (ts.createProgram, ts.factory), e
      # typescript-eslint, type-coverage e openapi-typescript dependem dela. Reavaliar quando o
      # 7.1 sair com a API nova e o typescript-eslint aceitar TS >= 7 no peer (issue 10940 deles).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # @types/x acompanha x na mesma major.minor (ETS item 66): atualizá-los juntos.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
