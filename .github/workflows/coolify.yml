name: Coolify release

on:
  # Reviewed boundary: successful same-repository main pushes only; trusted main
  # tooling rechecks exact CI SHA/attempt/jobs through the API before production.
  # Only OCI data from the exact accepted main run/attempt is consumed. No PR code executes.
  workflow_run: # zizmor: ignore[dangerous-triggers] reviewed and mitigated boundary; see release/README.md
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of current main with every CI gate successful
        required: true
        type: string
      ci_run:
        description: Original CI run ID for resuming a partial publication (with ci_attempt)
        required: false
        type: string
      ci_attempt:
        description: Original successful CI attempt for resuming a partial publication (with ci_run)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: coolify-production
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  RELEASE_PROJECT: goblinshift
  RESUME_CI_RUN_ID: ${{ inputs.ci_run }}
  RESUME_CI_RUN_ATTEMPT: ${{ inputs.ci_attempt }}

jobs:
  gates:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.gates.outputs.commit }}
      ci_run: ${{ steps.gates.outputs.ci_run }}
      ci_attempt: ${{ steps.gates.outputs.ci_attempt }}
      eligible: ${{ steps.gates.outputs.eligible }}
    steps:
      # Use trusted main tooling for CI validation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Exact CI gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SKIP_SUPERSEDED: 'true'
        run: python3 deploy/coolify/release/gate.py
      - name: Release tooling tests
        run: python3 -m unittest discover -s deploy/coolify/release -v

  publish-images:
    if: needs.gates.outputs.eligible == 'true'
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      eligible: ${{ steps.promotable.outputs.eligible }}
      app_index: ${{ steps.receipt.outputs.app_index }}
      executor_index: ${{ steps.receipt.outputs.executor_index }}
      web_index: ${{ steps.receipt.outputs.web_index }}
    env:
      RELEASE_COMMIT: ${{ needs.gates.outputs.commit }}
      CI_RUN_ID: ${{ needs.gates.outputs.ci_run }}
      CI_RUN_ATTEMPT: ${{ needs.gates.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gates.outputs.commit }}
      - name: Fetch the exact CI attempt receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.gates.outputs.ci_run }}
          name: gs-validated-oci-${{ needs.gates.outputs.ci_attempt }}
          path: ${{ runner.temp }}/oci-receipt
      - name: Validate the receipt and select the three artifacts by immutable ID
        id: receipt
        run: python3 deploy/coolify/release/ci_oci.py release "$RUNNER_TEMP/oci-receipt/oci-receipt.json"
      - name: Fetch the OCI data admitted by the CI receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.gates.outputs.ci_run }}
          artifact-ids: ${{ steps.receipt.outputs.ids }}
          path: ${{ runner.temp }}/ci-oci
      - name: Verify all OCI indexes before writing the registry
        run: |
          receipt="$RUNNER_TEMP/oci-receipt/oci-receipt.json"
          for role in app executor web; do
            digest=$(jq -er --arg role "$role" '.images[$role].digest' "$receipt")
            python3 deploy/coolify/release/ci_oci.py verify "$RUNNER_TEMP/ci-oci/gs-oci-$role-"* "$digest"
          done
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned OCI transport
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Recheck current main before any registry write
        id: publishable
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_SUPERSEDED: 'true'
        run: python3 deploy/coolify/release/gate.py
      - name: Publish exactly the three already verified sha tags
        if: steps.publishable.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          receipt="$RUNNER_TEMP/oci-receipt/oci-receipt.json"
          for role in app executor web; do
            digest=$(jq -er --arg role "$role" '.images[$role].digest' "$receipt")
            scripts/ci-oci.sh publish-check "$role" "$digest"
          done
          for role in app executor web; do
            digest=$(jq -er --arg role "$role" '.images[$role].digest' "$receipt")
            scripts/ci-oci.sh publish-sha "$role" "$digest" "$RUNNER_TEMP/ci-oci/gs-oci-$role-"*
          done
      - name: Recheck current main before moving the three main tags
        id: promotable
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_SUPERSEDED: 'true'
        run: python3 deploy/coolify/release/gate.py
      - name: Promote the three indexes by digest and verify the tags
        if: steps.promotable.outputs.eligible == 'true'
        run: |
          receipt="$RUNNER_TEMP/oci-receipt/oci-receipt.json"
          for role in app executor web; do
            digest=$(jq -er --arg role "$role" '.images[$role].digest' "$receipt")
            scripts/ci-oci.sh publish-main "$role" "$digest"
          done
      - name: Remove runner registry credentials
        if: always() && steps.publishable.outputs.eligible == 'true'
        run: crane auth logout ghcr.io

  deploy:
    if: needs.publish-images.outputs.eligible == 'true'
    needs: [gates, publish-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      RELEASE_COMMIT: ${{ needs.gates.outputs.commit }}
      CI_RUN_ID: ${{ needs.gates.outputs.ci_run }}
      CI_RUN_ATTEMPT: ${{ needs.gates.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gates.outputs.commit }}
      - name: Preserve original assets
        run: python3 deploy/coolify/release/assets.py
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned OCI transport
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Registry authentication on hosted runner only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Scan exact published images
        env:
          APP_INDEX: ${{ needs.publish-images.outputs.app_index }}
          WEB_INDEX: ${{ needs.publish-images.outputs.web_index }}
          EXECUTOR_INDEX: ${{ needs.publish-images.outputs.executor_index }}
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          echo '{}' > "$RUNNER_TEMP/scanned-images.json"
          for role in app web executor; do
            case "$role" in
              app) name=goblinshift; index="$APP_INDEX" ;;
              web) name=goblinshift-web; index="$WEB_INDEX" ;;
              executor) name=goblinshift-executor; index="$EXECUTOR_INDEX" ;;
            esac
            if ! [[ $index =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf 'Missing approved OCI index for %s\n' "$role" >&2
              exit 1
            fi
            repository="ghcr.io/bipoxdxd/$name"
            crane manifest "$repository@$index" > "$RUNNER_TEMP/scan-index.json"
            digest=$(python3 deploy/coolify/release/ci_oci.py amd64 "$RUNNER_TEMP/scan-index.json" "$index")
            reference="$repository@$digest"
            docker pull "$reference"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$reference"
            jq --arg role "$role" --arg ref "$reference" '. + {($role): $ref}' \
              "$RUNNER_TEMP/scanned-images.json" > "$RUNNER_TEMP/scanned-next.json"
            mv "$RUNNER_TEMP/scanned-next.json" "$RUNNER_TEMP/scanned-images.json"
          done
      - name: Configure project-bound publication key
        env:
          SSH_KEY: ${{ secrets.COOLIFY_RELEASE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.COOLIFY_RELEASE_KNOWN_HOSTS }}
          TARGET: ${{ vars.COOLIFY_RELEASE_TARGET }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$TARGET"
          install -m 700 -d "$RUNNER_TEMP/release-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/release-ssh/key"
          chmod 600 "$RUNNER_TEMP/release-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/release-ssh/known_hosts"
      - name: Skip superseded main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_SUPERSEDED: 'true'
        run: python3 deploy/coolify/release/gate.py
      - name: Import verified OCI images and publish through Coolify
        if: steps.latest.outputs.eligible == 'true'
        env:
          DEPLOY_KEY: ${{ runner.temp }}/release-ssh/key
          DEPLOY_KNOWN_HOSTS: ${{ runner.temp }}/release-ssh/known_hosts
          DEPLOY_TARGET: ${{ vars.COOLIFY_RELEASE_TARGET }}
          SCANNED_IMAGES_FILE: ${{ runner.temp }}/scanned-images.json
          PUBLICATION_FILE: ${{ runner.temp }}/publication/publication.json
        run: bash deploy/coolify/release/send.sh
      - name: Remove runner credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/release-ssh"
          crane auth logout ghcr.io
