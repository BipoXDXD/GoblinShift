name: Coolify release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of current main with every CI gate successful
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/coolify.yml
      - .github/workflows/publish-images.yml
      - deploy/coolify/release/**

permissions:
  contents: read

concurrency:
  # PR checks cannot replace pending production releases.
  group: ${{ github.event_name == 'pull_request' && format('coolify-pr-{0}', github.event.pull_request.number) || 'coolify-production' }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  RELEASE_PROJECT: goblinshift

jobs:
  release-tools:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release boundary and original media
        run: |
          python3 -m unittest discover -s deploy/coolify/release -v
          python3 deploy/coolify/release/assets.py

  gates:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.gates.outputs.commit }}
      ci_run: ${{ steps.gates.outputs.ci_run }}
      eligible: ${{ steps.gates.outputs.eligible }}
    steps:
      # Use trusted main tooling for CI validation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Exact CI gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          SKIP_SUPERSEDED: 'true'
        run: python3 deploy/coolify/release/gate.py
      - name: Release tooling tests
        run: python3 -m unittest discover -s deploy/coolify/release -v

  deploy:
    if: needs.gates.outputs.eligible == 'true'
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      RELEASE_COMMIT: ${{ needs.gates.outputs.commit }}
      CI_RUN_ID: ${{ needs.gates.outputs.ci_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gates.outputs.commit }}
      - name: Preserve original assets
        run: python3 deploy/coolify/release/assets.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned OCI transport
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Registry authentication on hosted runner only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Scan exact published images
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          tag="sha-${RELEASE_COMMIT:0:12}"
          echo '{}' > "$RUNNER_TEMP/scanned-images.json"
          for role in app web executor; do
            case "$role" in
              app) name=goblinshift ;;
              web) name=goblinshift-web ;;
              executor) name=goblinshift-executor ;;
            esac
            crane manifest "ghcr.io/bipoxdxd/$name:$tag" > "$RUNNER_TEMP/scan-index.json"
            if jq -e 'has("manifests")' "$RUNNER_TEMP/scan-index.json" >/dev/null; then
              digest=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("ambiguous platform") end' "$RUNNER_TEMP/scan-index.json")
            else
              digest=$(crane digest "ghcr.io/bipoxdxd/$name:$tag")
            fi
            reference="ghcr.io/bipoxdxd/$name@$digest"
            docker pull "$reference"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$reference"
            jq --arg role "$role" --arg ref "$reference" '. + {($role): $ref}' \
              "$RUNNER_TEMP/scanned-images.json" > "$RUNNER_TEMP/scanned-next.json"
            mv "$RUNNER_TEMP/scanned-next.json" "$RUNNER_TEMP/scanned-images.json"
          done
      - name: Configure project-bound publication key
        env:
          SSH_KEY: ${{ secrets.COOLIFY_RELEASE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.COOLIFY_RELEASE_KNOWN_HOSTS }}
          TARGET: ${{ vars.COOLIFY_RELEASE_TARGET }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$TARGET"
          install -m 700 -d "$RUNNER_TEMP/release-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/release-ssh/key"
          chmod 600 "$RUNNER_TEMP/release-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/release-ssh/known_hosts"
      - name: Skip superseded main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_SUPERSEDED: 'true'
        run: python3 deploy/coolify/release/gate.py
      - name: Import verified OCI images and publish through Coolify
        if: steps.latest.outputs.eligible == 'true'
        env:
          DEPLOY_KEY: ${{ runner.temp }}/release-ssh/key
          DEPLOY_KNOWN_HOSTS: ${{ runner.temp }}/release-ssh/known_hosts
          DEPLOY_TARGET: ${{ vars.COOLIFY_RELEASE_TARGET }}
          SCANNED_IMAGES_FILE: ${{ runner.temp }}/scanned-images.json
          PUBLICATION_FILE: ${{ runner.temp }}/publication/publication.json
        run: bash deploy/coolify/release/send.sh
      - name: Remove runner credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/release-ssh"
          crane auth logout ghcr.io
