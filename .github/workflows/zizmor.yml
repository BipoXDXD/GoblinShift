name: Auditoria dos workflows

# zizmor (análise estática de segurança do GitHub Actions e do dependabot.yml) só quando muda o que
# ele audita (`.github/`) ou o script que o instala: fora disso não há o que auditar, e o job fica
# fora do commit stage do ci.yml. O scripts/ci-zizmor.sh instala o zizmor por hash (versão e hashes
# em .github/zizmor/requirements.txt) e é o mesmo portão local; o achado justificado leva
# `# zizmor: ignore[...]` na própria linha.
on:
  pull_request:
    paths: [".github/**", "scripts/ci-zizmor.sh"]
  push:
    branches: [main]
    paths: [".github/**", "scripts/ci-zizmor.sh"]

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Segurança dos workflows (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        # Versão fixada: um audit novo numa versão nova não pode quebrar um PR sem relação com ele.
        run: scripts/ci-zizmor.sh --format=github
