name: Vencimento do security.txt

# Toda segunda, o lembrete com o relógio real (marcador `real_clock`): reprova quando faltam
# menos de 30 dias para o Expires de web/public/.well-known/security.txt. Fica fora da CI de PR
# para não travar merges sem relação; aqui a falha chega por e-mail ao dono, com quatro avisos
# semanais dentro da folga de 30 dias. Para renovar, adiantar o Expires em até um ano e implantar.
on:
  schedule:
    - cron: "29 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Mesmo motivo do ci.yml: o Python vem do setup-python, nunca de um download do uv.
  UV_PYTHON_DOWNLOADS: never

jobs:
  check:
    name: Conferir o Expires
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lembrete de renovação do security.txt
        # Sem nenhum teste selecionado o pytest sai com 5 e o job falha de propósito;
        # `--fail-on-skip` reprova se o lembrete terminar pulado.
        run: uv run pytest --fail-on-skip -q -p no:cacheprovider -m real_clock tests/test_security_policy.py
