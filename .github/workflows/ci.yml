name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Só PR cancela o run anterior: no push da main, um merge seguido de outro não pode interromper
# o primeiro run no meio da publicação (image, web-image, executor-image, tag-main); ele termina;
# o novo fica pendente (só o mais recente por grupo).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # O Python vem do setup-python (.python-version); se o uv tentar baixar outro, o job falha
  # em vez de rodar silenciosamente com um interpretador diferente.
  UV_PYTHON_DOWNLOADS: never

jobs:
  checks:
    name: Verificações
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APT_PACOTES: age ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala exatamente a versão de .python-version, sem depender do catálogo embutido no uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Chave do cache do apt (pacotes pedidos e pacotes já instalados na imagem)
        id: apt-chave
        run: echo "valor=apt-$({ echo "$APT_PACOTES"; dpkg-query -W; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-chave.outputs.valor }}
      - name: Instalar o age (backup) e o FFmpeg completo (vídeos sintéticos do Media Mill)
        # O FFmpeg do runner só gera e confere fixtures; a receita, na imagem do executor, usa o
        # build mínimo do ADR 036.
        # Com o cache, os .deb vêm do Actions e o apt não usa a rede; sem ele, cada espelho do
        # Ubuntu tem um teto por tentativa (scripts/ci-apt-instalar.sh).
        timeout-minutes: 10
        env:
          DEBS: ${{ runner.temp }}/apt-debs
        run: |
          read -ra pacotes <<<"$APT_PACOTES"
          scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-chave.outputs.valor }}
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: Contratos de arquitetura (import-linter)
        run: uv run lint-imports
      - name: Testes (inclui PostgreSQL real via Testcontainers)
        # Os do OpenObserve rodam no job próprio, em paralelo, para caber no orçamento do commit
        # stage (5 min): só o cenário do agendador leva cerca de 2 min.
        # A imagem do executor compila o FFmpeg (ADR 036): os testes dela rodam só no job gvisor,
        # sob runsc, que depende deste; aqui ficariam minutos acima do orçamento.
        # `--fail-on-skip`: teste pulado reprova (tests/skip_guard.py). O que só roda como root fica
        # fora daqui (`needs_root`) e roda no passo seguinte. Os da arte (`arte`) precisam de Blender
        # e ImageMagick locais e não rodam na CI.
        run: uv run pytest --fail-on-skip -m "not openobserve and not executor_image and not needs_root and not real_clock and not arte"
      - name: Testes que exigem root (runner descartável, sudo sem senha)
        # Política nativa de imagens e troca de UID na área de trabalho do executor-ctl. O runner
        # hospedado é descartado no fim do job; nada disso roda como root fora dele. Sem bytecode
        # nem cache, o root não deixa arquivo seu na árvore.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: sudo -E env "PATH=$PATH" .venv/bin/pytest --fail-on-skip -p no:cacheprovider -m needs_root tests/executor_ctl

  host-python:
    name: Scripts do host (Python 3.12)
    # Os pacotes de deploy/ marcados py312 no pyproject rodam no python3 do host (3.12, o do
    # Ubuntu 24.04), não no Python da imagem. Este job confere o piso de versão e roda os testes
    # deles nesse interpretador. Sem `if`: o gate da publicação exige o sucesso dele.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # O import de dump_check criaria __pycache__ ao lado dos arquivos de configuração do backup.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Importar os pacotes com o Python limpo do host
        run: python -I -S -B scripts/check_host_python.py --imports-only
      - name: Instalar ferramentas de análise e de teste (hashes conferidos)
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary ':all:' -r tests/host_python/requirements.txt
      - name: Piso de versão dos pacotes do host
        # Vermin confere a versão mínima. O mypy usa as assinaturas da stdlib do Python 3.12.
        run: python scripts/check_host_python.py
      - name: Testes dos pacotes do host
        # O shell bash usa pipefail. Se o grep falhar, o job para antes de chamar o pytest.
        # O conftest da aplicação fica fora, e os testes com needs_root rodam em Verificações.
        shell: bash
        run: |
          marca='^pytestmark = (\[)?pytest\.mark\.host_python\b'
          pastas=(tests/acceptance tests/executor_ctl tests/executor_inventory_read tests/host_python tests/tls_check)
          marcados=$(grep -rlE --include='test_*.py' "$marca" "${pastas[@]}" | sort)
          mapfile -t modulos <<< "$marcados"
          python -m pytest -p no:cacheprovider -p tests.skip_guard --fail-on-skip --confcutdir=tests/executor_ctl -m "host_python and not needs_root" "${modulos[@]}"
      - name: Testes unitários do backup e do OpenObserve
        # Os conftests destas pastas carregam a aplicação e serviços de integração.
        # Os módulos marcados aqui exercitam os scripts com fixtures do próprio pytest.
        shell: bash
        run: |
          marca='^pytestmark = (\[)?pytest\.mark\.host_python\b'
          marcados=$(grep -rlE --include='test_*.py' "$marca" tests/backup tests/openobserve | sort)
          mapfile -t modulos <<< "$marcados"
          python -m pytest -p no:cacheprovider -p tests.skip_guard --fail-on-skip --noconftest -m "host_python and not needs_root" "${modulos[@]}"

  openobserve:
    name: SLOs e alertas (OpenObserve)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala exatamente a versão de .python-version, sem depender do catálogo embutido no uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: OpenObserve e Collector reais via Testcontainers
        # Sem nenhum teste selecionado o pytest sai com 5 e o job falha de propósito.
        run: uv run pytest -m "openobserve and not needs_root" -q --fail-on-skip

  contract:
    name: Contrato (Schemathesis)
    runs-on: ubuntu-24.04
    # Orçamento do job: o Schemathesis leva cerca de 30 s; o resto é sincronizar e subir a API.
    timeout-minutes: 6
    services:
      # Banco descartável do próprio runner, na versão de compose.yaml. O script se recusa a
      # rodar contra outro host: o teste de contrato nunca toca a produção.
      postgres:
        image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
        env:
          POSTGRES_DB: goblinshift
          POSTGRES_USER: goblinshift
          POSTGRES_PASSWORD: goblinshift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goblinshift -d goblinshift"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala exatamente a versão de .python-version, sem depender do catálogo embutido no uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group contract
      - name: Schemathesis --checks=all contra a API local
        # Falha com 500 ou com resposta fora da spec exportada (scripts/contract-test.sh).
        run: ./scripts/contract-test.sh

  web:
    name: Interface web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Monitor de uptime (deploy/uptime)
        working-directory: deploy/uptime
        run: node --test uptime.test.mjs
      - run: npm ci
      - name: Contrato OpenAPI → tipos gerados em dia
        # O pytest (job Verificações) garante que openapi/openapi.json acompanha a API; aqui, que
        # os tipos TypeScript acompanham o openapi.json versionado.
        run: |
          npm run generate:api
          git diff --exit-code -- openapi src/api/schema.d.ts
      - name: Tipos (tsc, separado do build)
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Testes (Vitest)
        run: npm test
      - name: Código e dependências mortos (knip)
        run: npm run knip
      - name: Cobertura de tipos (type-coverage)
        run: npm run type-coverage
      - name: Build
        run: npm run build
      - name: Orçamento de peso (JS, CSS, fontes, goblins e 3D da abertura, ADR 027 e 030)
        run: npm run budget
      - name: Proveniência da arte (ADR 030)
        run: npm run provenance

  e2e:
    name: Interface no navegador (Playwright)
    # Em paralelo com web. O job inteiro levou até 11,1 min nos runs verdes recentes, e o
    # limite de 12 min já estourou em runner lento, cancelando o CI. O limite é o dobro disso e
    # cobre também o pior caso do apt das dependências (3 tentativas de 90 s), sem reduzir testes.
    # A API é falsa e o build usa os cabeçalhos de produção do Nginx
    # (web/e2e/server/serve-dist.ts).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Versão do Playwright (chave do cache do navegador)
        id: playwright
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Chromium headless e dependências do sistema
        # O `--with-deps` do Playwright roda o apt sem teto; as que faltam vêm do script com teto e
        # troca de espelho (sem cache: a lista muda com o Playwright), e o navegador depois. Com
        # 90 s por tentativa, o pior caso do apt fica em 4,5 min; o saudável levou de 15 s a 50 s.
        timeout-minutes: 6
        env:
          DEBS: ${{ runner.temp }}/apt-debs
          CI_APT_TENTATIVA_S: "90"
        run: |
          lista=$(../scripts/ci-playwright-pacotes.sh chromium)
          if [[ -n $lista ]]; then
            mapfile -t pacotes <<<"$lista"
            ../scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
          fi
          npx playwright install --only-shell chromium
      - name: Build
        run: npm run build
      - name: Conferir partição exata das specs por ID e projeto
        run: npm run e2e:check-phases
      - name: Specs (desktop e celular, só Chromium)
        env:
          E2E_PHASE: ui
        run: npm run e2e
      # SwiftShader disputa os núcleos com os demais workers. Uma cena por vez,
      # inclusive entre os projetos, mantém os mesmos casos e tetos (sem retry).
      - name: Palco 3D com GPU (desktop e celular, um worker)
        env:
          E2E_PHASE: gpu
        run: npm run e2e
      - name: Capturas dos controles 3D para aprovação visual
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controles-inclinacao-3d
          path: web/test-results/**/controles-inclinacao.png
          if-no-files-found: ignore
          retention-days: 14
      # Segundo build, com o aviso de e2e/fixtures/notice.json (ADR 031): a faixa em toda tela,
      # sem layout shift e com contraste. O notice.json do repositório começa sem aviso.
      - name: Build com o aviso global
        run: npm run build:notice-e2e
      - name: Specs com o aviso global
        env:
          E2E_PHASE: notice
        run: npm run e2e:notice
      # Caso que não roda num projeto sai dele por tag (grepInvert), não por skip em runtime.
      - name: Nenhum teste pulado (relatórios json das três fases)
        run: npm run e2e:check-skips -- e2e-results/ui.json e2e-results/gpu.json e2e-results/notice.json
      # O relatório e os traces ficam fora do artefato se a chave da conta de teste (formato
      # gsk_...) aparecer em qualquer arquivo ou dentro de um .zip: o repositório é público.
      - name: Canário (chave de API nos artefatos)
        id: canario
        if: always()
        run: python3 ../scripts/verificar_artefatos_sem_chave.py playwright-report test-results
      - name: Relatório e traces da falha
        if: failure() && steps.canario.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico inteiro: um segredo apagado num commit posterior continua público.
          fetch-depth: 0
          persist-credentials: false
      # `--log-opts=--full-history HEAD`: o histórico de HEAD, que é main mais os commits do PR
      # (no PR, HEAD é o merge commit sintético). Sem a flag, o gitleaks roda `git log --all` e
      # julga o PR por qualquer branch do remoto, porque o checkout com fetch-depth 0 traz todas.
      # Uma regra nova no .gitleaks.toml reavalia o histórico inteiro de main no PR que a adiciona.
      # `--diff-merges=first-parent`: sem ela o git log não mostra o diff de merge commits, e um
      # segredo introduzido só na resolução de um merge (evil merge) passaria (issue #406).
      - name: gitleaks no histórico de HEAD
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner "--log-opts=--full-history --diff-merges=first-parent HEAD"

  gvisor:
    name: Executor sob gVisor
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APT_PACOTES: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala exatamente a versão de .python-version, sem depender do catálogo embutido no uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Instalar o runsc e registrá-lo no Docker do runner
        # Leva cerca de 20 s. O `update` lê só a fonte do gVisor: os espelhos do Ubuntu, que já
        # prenderam este passo por 50 min, ficam de fora (scripts/ci-install-runsc.sh).
        timeout-minutes: 5
        run: scripts/ci-install-runsc.sh
      - name: Chave do cache do apt (pacotes pedidos e pacotes já instalados na imagem)
        id: apt-chave
        run: echo "valor=apt-$({ echo "$APT_PACOTES"; dpkg-query -W; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-chave.outputs.valor }}
      - name: FFmpeg completo (gera os vídeos sintéticos dos testes do Media Mill na imagem)
        # Com o cache, os .deb vêm do Actions e o apt não usa a rede; sem ele, cada espelho do
        # Ubuntu tem um teto por tentativa (scripts/ci-apt-instalar.sh).
        timeout-minutes: 10
        env:
          DEBS: ${{ runner.temp }}/apt-debs
        run: |
          read -ra pacotes <<<"$APT_PACOTES"
          scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-chave.outputs.valor }}
      - name: Testes do executor-ctl e da imagem do executor sob runsc
        env:
          GS_TEST_RUNTIME: runsc
        # Sem nenhum teste selecionado o pytest sai com 5 e o job falha de propósito: os testes
        # executor_image sempre existem, então zero testes indica um seletor quebrado.
        run: uv run pytest -m "(executor_ctl or executor_image) and not needs_root" -q --fail-on-skip

  e2e-gvisor:
    name: Jornadas reais sob gVisor (Playwright)
    # O caminho navegador, Nginx, API, worker, executor-ctl do host e container gVisor. O job
    # e2e usa API falsa, e o Compose local, o Runner sem sandbox. Em paralelo, como o OpenObserve:
    # fora do orçamento de 5 min do commit stage. Nenhum segredo: conta e chave nascem e morrem
    # na pilha descartável do runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar o runsc e registrá-lo no Docker do runner
        # Mesmo teto do job gvisor: o script leva cerca de 20 s e não pode prender o runner.
        timeout-minutes: 5
        run: scripts/ci-install-runsc.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Versão do Playwright (chave do cache do navegador)
        id: playwright
        working-directory: web
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Chromium headless e dependências do sistema
        # Como no job e2e: o `--with-deps` roda o apt sem teto, então o que falta vem do script com
        # teto por tentativa e troca de espelho, e o navegador entra depois.
        working-directory: web
        timeout-minutes: 6
        env:
          DEBS: ${{ runner.temp }}/apt-debs
          CI_APT_TENTATIVA_S: "90"
        run: |
          lista=$(../scripts/ci-playwright-pacotes.sh chromium)
          if [[ -n $lista ]]; then
            mapfile -t pacotes <<<"$lista"
            ../scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
          fi
          npx playwright install --only-shell chromium
      - name: Pilha com o executor-ctl do host sob gVisor
        run: scripts/e2e-gvisor.sh up
      - name: Specs contra a API real (desktop e celular, só Chromium)
        # Falha também se alguma tentativa do banco não tiver rodado sob runsc.
        run: scripts/e2e-gvisor.sh journeys
      - name: Nenhum teste pulado (relatório json da suíte gVisor)
        working-directory: web
        run: npm run e2e:check-skips -- e2e-results/all.json
      - name: Logs da pilha e do executor-ctl
        if: failure()
        run: scripts/e2e-gvisor.sh logs "$RUNNER_TEMP/e2e-gvisor-logs"
      # Sem trace nesta suíte (web/e2e/playwright.config.ts): o trace guarda a chave `gsk_...` do
      # header Authorization e o Playwright não tem opção para mascará-la. O canário confere o que
      # sobra (relatório, test-results e logs) antes do upload.
      - name: Canário (chave de API nos artefatos)
        id: canario
        if: always()
        run: >-
          python3 scripts/verificar_artefatos_sem_chave.py
          web/playwright-report web/test-results "$RUNNER_TEMP/e2e-gvisor-logs"
      - name: Relatório e logs da falha (sem traces)
        if: failure() && steps.canario.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-gvisor
          path: |
            web/playwright-report/
            web/test-results/
            ${{ runner.temp }}/e2e-gvisor-logs/
          retention-days: 7

  image:
    name: Imagem
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      artifact: ${{ steps.layout.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/oci-app,tar=false
          build-args: GS_SERVICE_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned OCI transport
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Verificar e escanear os manifests AMD64 e ARM64 no registro descartável
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          scripts/ci-oci.sh registry
          scripts/ci-oci.sh stage app "$INDEX_DIGEST" "$RUNNER_TEMP/oci-app"
          scripts/ci-oci.sh scan app "$INDEX_DIGEST"
      - id: layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gs-oci-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci-app/
          if-no-files-found: error
          compression-level: 0

  executor-image:
    name: Imagem do executor
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      artifact: ${{ steps.layout.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/executor.Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/oci-executor,tar=false
          cache-from: type=gha,scope=executor
          cache-to: type=gha,scope=executor,mode=max
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned OCI transport
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Verificar e escanear os manifests AMD64 e ARM64 no registro descartável
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          scripts/ci-oci.sh registry
          scripts/ci-oci.sh stage executor "$INDEX_DIGEST" "$RUNNER_TEMP/oci-executor"
          scripts/ci-oci.sh scan executor "$INDEX_DIGEST"
      - id: layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gs-oci-executor-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci-executor/
          if-no-files-found: error
          compression-level: 0

  web-image:
    name: Imagem do Nginx com a SPA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      artifact: ${{ steps.layout.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/oci-web,tar=false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned OCI transport
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Verificar e escanear os manifests AMD64 e ARM64 no registro descartável
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          scripts/ci-oci.sh registry
          scripts/ci-oci.sh stage web "$INDEX_DIGEST" "$RUNNER_TEMP/oci-web"
          scripts/ci-oci.sh scan web "$INDEX_DIGEST"
      - id: layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gs-oci-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci-web/
          if-no-files-found: error
          compression-level: 0

  deploy:
    name: Deploy na VPS
    # Conserva o contrato de recusa legado e executa os testes reais do receptor contra fixtures.
    # O único ingresso de produção está no workflow Coolify release.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recusa do ingresso SSH legado
        run: |
          rc=0
          deploy/deploy.sh "$GITHUB_SHA" "sha-${GITHUB_SHA:0:12}" || rc=$?
          test "$rc" -eq 64
      - name: Contrato de admissão, receptor e preservação de mídias
        run: |
          python3 -m unittest discover -s deploy/coolify/release -v
          python3 deploy/coolify/release/assets.py

  vps-smoke:
    name: Jornadas na VPS (pós-deploy)
    # Mesmas jornadas de leitura da VPS, com as imagens do CI e uma conta efêmera local.
    needs: [deploy, image, web-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned OCI transport
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact }},${{ needs.web-image.outputs.artifact }}
          path: ${{ runner.temp }}/ci-oci
      - name: Restaurar exatamente as duas imagens verificadas pelo CI
        env:
          APP_DIGEST: ${{ needs.image.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-image.outputs.digest }}
        run: |
          scripts/ci-oci.sh registry
          scripts/ci-oci.sh stage app "$APP_DIGEST" "$RUNNER_TEMP/ci-oci/gs-oci-app-"*
          scripts/ci-oci.sh stage web "$WEB_DIGEST" "$RUNNER_TEMP/ci-oci/gs-oci-web-"*
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Chromium, Firefox e dependências
        timeout-minutes: 10
        working-directory: web
        env:
          DEBS: ${{ runner.temp }}/apt-debs
        run: |
          lista=$(../scripts/ci-playwright-pacotes.sh chromium firefox)
          if [[ -n $lista ]]; then
            mapfile -t pacotes <<<"$lista"
            ../scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
          fi
          npx playwright install chromium firefox
      - name: Controle negativo ARIA do Firefox empacotado r1572
        working-directory: web
        run: node scripts/check-firefox-aria.ts --expect-crash
      - name: Firefox oficial r1575 verificado
        run: python3 scripts/ci_firefox.py
      - name: Regressão ARIA com o Firefox corrigido
        working-directory: web
        run: node scripts/check-firefox-aria.ts
      - name: Borda e jornadas de leitura com a pilha descartável
        env:
          CI_APP_IMAGE: 127.0.0.1:5000/goblinshift@${{ needs.image.outputs.digest }}
          CI_WEB_IMAGE: 127.0.0.1:5000/goblinshift-web@${{ needs.web-image.outputs.digest }}
        run: scripts/e2e-ci-release.sh
      - name: Remover o Firefox temporário
        if: always()
        run: python3 scripts/ci_firefox.py --cleanup

  tag-main:
    name: Imagem e componentes com tag main
    # Exercita a promoção por digest para as três imagens. Só o workflow Coolify escreve no GHCR.
    needs:
      - checks
      - host-python
      - openobserve
      - contract
      - web
      - e2e
      - secrets
      - gvisor
      - e2e-gvisor
      - image
      - executor-image
      - web-image
      - deploy
      - vps-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned OCI transport
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact }},${{ needs.executor-image.outputs.artifact }},${{ needs.web-image.outputs.artifact }}
          path: ${{ runner.temp }}/ci-oci
      - name: Promover os três índices no registro descartável e selar o recibo
        env:
          APP_DIGEST: ${{ needs.image.outputs.digest }}
          EXECUTOR_DIGEST: ${{ needs.executor-image.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-image.outputs.digest }}
          APP_ARTIFACT: ${{ needs.image.outputs.artifact }}
          EXECUTOR_ARTIFACT: ${{ needs.executor-image.outputs.artifact }}
          WEB_ARTIFACT: ${{ needs.web-image.outputs.artifact }}
        run: |
          scripts/ci-oci.sh registry
          for role in app executor web; do
            variable="${role^^}_DIGEST"
            scripts/ci-oci.sh stage "$role" "${!variable}" "$RUNNER_TEMP/ci-oci/gs-oci-$role-"*
            scripts/ci-oci.sh promote "$role" "${!variable}"
          done
          python3 deploy/coolify/release/ci_oci.py record "$RUNNER_TEMP/oci-receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gs-validated-oci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci-receipt.json
          if-no-files-found: error
