name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verificações
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: Contratos de arquitetura (import-linter)
        run: uv run lint-imports
      - name: Testes (inclui PostgreSQL real via Testcontainers)
        run: uv run pytest

  image:
    name: Imagem
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          build-args: GS_SERVICE_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ghcr.io/bipoxdxd/goblinshift:${{ steps.vars.outputs.tag }}
            ghcr.io/bipoxdxd/goblinshift:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS
    needs: image
    # Só roda depois que a VPS estiver configurada (variáveis do repositório definidas).
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          VPS_TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        # A chave da CI na VPS (usuário goblinshift) só pode executar deploy/deploy.sh (forced command).
        run: ssh "$VPS_TARGET" "deploy $GITHUB_SHA $IMAGE_TAG"
