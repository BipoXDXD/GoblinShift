name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # O Python vem do setup-python (.python-version); se o uv tentar baixar outro, o job falha
  # em vez de rodar silenciosamente com um interpretador diferente.
  UV_PYTHON_DOWNLOADS: never

jobs:
  checks:
    name: Verificações
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APT_PACOTES: age ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala exatamente a versão de .python-version, sem depender do catálogo embutido no uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Chave do cache do apt (pacotes pedidos e pacotes já instalados na imagem)
        id: apt-chave
        run: echo "valor=apt-$({ echo "$APT_PACOTES"; dpkg-query -W; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-chave.outputs.valor }}
      - name: Instalar o age (backup) e o FFmpeg completo (vídeos sintéticos do Media Mill)
        # O FFmpeg do runner só gera e confere fixtures; a receita, na imagem do executor, usa o
        # build mínimo do ADR 036.
        # Com o cache, os .deb vêm do Actions e o apt não usa a rede; sem ele, cada espelho do
        # Ubuntu tem um teto por tentativa (scripts/ci-apt-instalar.sh).
        timeout-minutes: 10
        env:
          DEBS: ${{ runner.temp }}/apt-debs
        run: |
          read -ra pacotes <<<"$APT_PACOTES"
          scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-chave.outputs.valor }}
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: Contratos de arquitetura (import-linter)
        run: uv run lint-imports
      - name: Testes (inclui PostgreSQL real via Testcontainers)
        # Os do OpenObserve rodam no job próprio, em paralelo, para caber no orçamento do commit
        # stage (5 min): só o cenário do agendador leva cerca de 2 min.
        # A imagem do executor compila o FFmpeg (ADR 036): os testes dela rodam só no job gvisor,
        # sob runsc, que depende deste; aqui ficariam minutos acima do orçamento.
        run: uv run pytest -m "not openobserve and not executor_image"

  openobserve:
    name: SLOs e alertas (OpenObserve)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala exatamente a versão de .python-version, sem depender do catálogo embutido no uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: OpenObserve e Collector reais via Testcontainers
        # Sem nenhum teste selecionado o pytest sai com 5 e o job falha de propósito.
        run: uv run pytest -m openobserve -q

  contract:
    name: Contrato (Schemathesis)
    runs-on: ubuntu-24.04
    # Orçamento do job: o Schemathesis leva cerca de 30 s; o resto é sincronizar e subir a API.
    timeout-minutes: 6
    services:
      # Banco descartável do próprio runner, na versão de compose.yaml. O script se recusa a
      # rodar contra outro host: o teste de contrato nunca toca a produção.
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: goblinshift
          POSTGRES_USER: goblinshift
          POSTGRES_PASSWORD: goblinshift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goblinshift -d goblinshift"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala exatamente a versão de .python-version, sem depender do catálogo embutido no uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group contract
      - name: Schemathesis --checks=all contra a API local
        # Falha com 500 ou com resposta fora da spec exportada (scripts/contract-test.sh).
        run: ./scripts/contract-test.sh

  web:
    name: Interface web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Monitor de uptime (deploy/uptime)
        working-directory: deploy/uptime
        run: node --test uptime.test.mjs
      - run: npm ci
      - name: Contrato OpenAPI → tipos gerados em dia
        # O pytest (job Verificações) garante que openapi/openapi.json acompanha a API; aqui, que
        # os tipos TypeScript acompanham o openapi.json versionado.
        run: |
          npm run generate:api
          git diff --exit-code -- openapi src/api/schema.d.ts
      - name: Tipos (tsc, separado do build)
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Testes (Vitest)
        run: npm test
      - name: Código e dependências mortos (knip)
        run: npm run knip
      - name: Cobertura de tipos (type-coverage)
        run: npm run type-coverage
      - name: Build
        run: npm run build
      - name: Orçamento de peso (JS, CSS, fontes, goblins e 3D da abertura, ADR 027 e 030)
        run: npm run budget
      - name: Proveniência da arte (ADR 030)
        run: npm run provenance

  e2e:
    name: Interface no navegador (Playwright)
    # Em paralelo com web. O job inteiro levou até 11,1 min nos runs verdes recentes, e o
    # limite de 12 min já estourou em runner lento, cancelando o CI. O limite é o dobro disso e
    # cobre também o pior caso do apt das dependências (3 tentativas de 90 s), sem reduzir testes.
    # A API é falsa e o build usa os cabeçalhos de produção do Nginx
    # (web/e2e/server/serve-dist.ts).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Versão do Playwright (chave do cache do navegador)
        id: playwright
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Chromium headless e dependências do sistema
        # O `--with-deps` do Playwright roda o apt sem teto; as que faltam vêm do script com teto e
        # troca de espelho (sem cache: a lista muda com o Playwright), e o navegador depois. Com
        # 90 s por tentativa, o pior caso do apt fica em 4,5 min; o saudável levou de 15 s a 50 s.
        timeout-minutes: 6
        env:
          DEBS: ${{ runner.temp }}/apt-debs
          CI_APT_TENTATIVA_S: "90"
        run: |
          lista=$(../scripts/ci-playwright-pacotes.sh chromium)
          if [[ -n $lista ]]; then
            mapfile -t pacotes <<<"$lista"
            ../scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
          fi
          npx playwright install --only-shell chromium
      - name: Build
        run: npm run build
      - name: Conferir partição exata das specs por ID e projeto
        run: npm run e2e:check-phases
      - name: Specs (desktop e celular, só Chromium)
        env:
          E2E_PHASE: ui
        run: npm run e2e
      # SwiftShader disputa os núcleos com os demais workers. Uma cena por vez,
      # inclusive entre os projetos, mantém os mesmos casos e tetos (sem retry).
      - name: Palco 3D com GPU (desktop e celular, um worker)
        env:
          E2E_PHASE: gpu
        run: npm run e2e
      - name: Capturas dos controles 3D para aprovação visual
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controles-inclinacao-3d
          path: web/test-results/**/controles-inclinacao.png
          if-no-files-found: ignore
          retention-days: 14
      # Segundo build, com o aviso de e2e/fixtures/notice.json (ADR 031): a faixa em toda tela,
      # sem layout shift e com contraste. O notice.json do repositório começa sem aviso.
      - name: Build com o aviso global
        run: npm run build:notice-e2e
      - name: Specs com o aviso global
        env:
          E2E_PHASE: notice
        run: npm run e2e:notice
      - name: Relatório e traces da falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico inteiro: um segredo apagado num commit posterior continua público.
          fetch-depth: 0
          persist-credentials: false
      # `--log-opts=--full-history HEAD`: o histórico de HEAD, que é main mais os commits do PR
      # (no PR, HEAD é o merge commit sintético). Sem a flag, o gitleaks roda `git log --all` e
      # julga o PR por qualquer branch do remoto, porque o checkout com fetch-depth 0 traz todas.
      # Uma regra nova no .gitleaks.toml reavalia o histórico inteiro de main no PR que a adiciona.
      - name: gitleaks no histórico de HEAD
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner "--log-opts=--full-history HEAD"

  gvisor:
    name: Executor sob gVisor
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APT_PACOTES: ffmpeg
      # Mesma versão da VPS (docs/adr/004-container-gvisor-por-tentativa.md). O repositório do
      # gVisor publica cada release como uma suíte própria, então a versão fica fixada aqui.
      GVISOR_SUITE: "20261005"
      GVISOR_VERSION: "20261005.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala exatamente a versão de .python-version, sem depender do catálogo embutido no uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Instalar o runsc (repositório oficial do gVisor, a mesma origem de deploy/gvisor.sh)
        # Leva cerca de 20 s. O `update` lê só a fonte do gVisor: os espelhos do Ubuntu, que já
        # prenderam este passo por 50 min, ficam de fora, e as listas da imagem seguem valendo.
        timeout-minutes: 5
        run: |
          keyring=/usr/share/keyrings/gvisor-archive-keyring.gpg
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 https://gvisor.dev/archive.key | sudo gpg --dearmor -o "$keyring"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=${keyring}] https://storage.googleapis.com/gvisor/releases ${GVISOR_SUITE} main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          apt_rede=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3)
          sudo apt-get update -q "${apt_rede[@]}" -o Dir::Etc::sourcelist=sources.list.d/gvisor.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -yq "${apt_rede[@]}" "runsc=${GVISOR_VERSION}"
          runsc --version | head -n 1
      - name: Registrar o runtime runsc no Docker do runner
        # O runner é efêmero e só roda este job, então reiniciar o Docker aqui não derruba nada.
        # Na VPS isso nunca se faz: lá o Docker é só recarregado (deploy/gvisor.sh), porque o host
        # é compartilhado com outro projeto.
        run: |
          if ! docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'; then
            sudo runsc install
          fi
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
      - name: Chave do cache do apt (pacotes pedidos e pacotes já instalados na imagem)
        id: apt-chave
        run: echo "valor=apt-$({ echo "$APT_PACOTES"; dpkg-query -W; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-chave.outputs.valor }}
      - name: FFmpeg completo (gera os vídeos sintéticos dos testes do Media Mill na imagem)
        # Com o cache, os .deb vêm do Actions e o apt não usa a rede; sem ele, cada espelho do
        # Ubuntu tem um teto por tentativa (scripts/ci-apt-instalar.sh).
        timeout-minutes: 10
        env:
          DEBS: ${{ runner.temp }}/apt-debs
        run: |
          read -ra pacotes <<<"$APT_PACOTES"
          scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-chave.outputs.valor }}
      - name: Testes do executor-ctl e da imagem do executor sob runsc
        env:
          GS_TEST_RUNTIME: runsc
        # Sem nenhum teste selecionado o pytest sai com 5 e o job falha de propósito: os testes
        # executor_image sempre existem, então zero testes indica um seletor quebrado.
        run: uv run pytest -m "executor_ctl or executor_image" -q

  image:
    name: Imagem
    # O contrato também: publicar uma API que dá 500 ou foge da spec quebraria os clientes gerados.
    needs: [checks, contract, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # O executor/Python precisa executar etapas de ARM64 no runner AMD64. Só no runner efêmero.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GS_SERVICE_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ghcr.io/bipoxdxd/goblinshift:${{ steps.vars.outputs.tag }}
            ghcr.io/bipoxdxd/goblinshift:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar ARM64 e AMD64 na imagem publicada
        env:
          IMAGE_REF: ghcr.io/bipoxdxd/goblinshift@${{ steps.build.outputs.digest }}
        run: scripts/docker-build.sh published "$IMAGE_REF"

  executor-image:
    name: Imagem do executor
    needs: [checks, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # O executor/Python precisa executar etapas de ARM64 no runner AMD64. Só no runner efêmero.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/executor.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Mesma tag da imagem da aplicação: o deploy resolve o digest do executor por ela.
          tags: |
            ghcr.io/bipoxdxd/goblinshift-executor:${{ steps.vars.outputs.tag }}
            ghcr.io/bipoxdxd/goblinshift-executor:main
          # Escopo próprio, para não disputar o cache da imagem da aplicação.
          cache-from: type=gha,scope=executor
          cache-to: type=gha,scope=executor,mode=max

      - name: Verificar ARM64 e AMD64 na imagem publicada
        env:
          IMAGE_REF: ghcr.io/bipoxdxd/goblinshift-executor@${{ steps.build.outputs.digest }}
        run: scripts/docker-build.sh published "$IMAGE_REF"

  web-image:
    name: Imagem do Nginx com a SPA
    # O job web garante tipos, lint, testes e build da SPA, e o e2e, que ela funciona no navegador
    # com a CSP de produção, antes de publicar o que ela gera.
    needs: [checks, web, e2e, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # O executor/Python precisa executar etapas de ARM64 no runner AMD64. Só no runner efêmero.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Mesma tag da imagem da aplicação: o Compose do deploy referencia as duas por ela.
          tags: |
            ghcr.io/bipoxdxd/goblinshift-web:${{ steps.vars.outputs.tag }}
            ghcr.io/bipoxdxd/goblinshift-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Verificar ARM64 e AMD64 na imagem publicada
        env:
          IMAGE_REF: ghcr.io/bipoxdxd/goblinshift-web@${{ steps.build.outputs.digest }}
        run: scripts/docker-build.sh published "$IMAGE_REF"

  deploy:
    name: Deploy na VPS
    # O sandbox real (gVisor) também precisa passar: implantar com o executor quebrado deixaria
    # execuções aceitas sem ter onde rodar.
    needs: [image, executor-image, web-image, gvisor, openobserve]
    # Coolify é o único ingresso automático de publicação. O legado fica desativado na fonte,
    # independentemente de variáveis administrativas. Manter este job pulado e seu dependente
    # preserva os dois resultados skipped que o gate de release exige antes de enviar imagens.
    if: "false"
    runs-on: ubuntu-24.04
    # Os segredos VPS_SSH_KEY e VPS_KNOWN_HOSTS moram só neste environment, cuja política de
    # branches é "só main" (configuração do GitHub, ADR 033): nenhum outro ref lê a chave da VPS.
    environment: production
    # O job não usa o GITHUB_TOKEN (sem checkout nem API): nenhuma permissão.
    permissions: {}
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          VPS_TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        # Legado: o job nunca roda (`if: "false"`), e o deploy/deploy.sh, único comando que a chave
        # da CI pode executar na VPS (forced command), hoje só recusa.
        run: |
          # SC2029: expandir aqui é o objetivo; a VPS recebe o SHA e a tag já resolvidos.
          # shellcheck disable=SC2029
          ssh "$VPS_TARGET" "deploy $GITHUB_SHA $IMAGE_TAG"

  vps-smoke:
    name: Jornadas na VPS (pós-deploy)
    # A borda e as jornadas de leitura contra o site recém-implantado, no Chromium e no Firefox.
    # Pulado junto com o deploy.
    needs: [deploy]
    # Fica `./` e não `$/` (audit self-repository do zizmor): em jobs.<id>.uses o `./` já resolve
    # para o mesmo commit do workflow que chama, sem ler o disco do runner, que é o risco do audit.
    # O `$/` ainda quebra o actionlint 1.7.12 (rhysd/actionlint#711); trocar quando ele aceitar.
    uses: ./.github/workflows/e2e-vps.yml # zizmor: ignore[self-repository]
    # Nada de `secrets: inherit`: o reutilizável não precisa da chave SSH da VPS. Dentro dele, o
    # job no environment production lê o E2E_VPS_API_KEY do environment, que vence este.
    secrets:
      E2E_VPS_API_KEY: ${{ secrets.E2E_VPS_API_KEY }}
