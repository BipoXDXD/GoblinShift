name: Jornadas na VPS

# Depois do deploy (chamado pelo job vps-smoke do ci.yml) e à mão (workflow_dispatch): a borda da
# SPA (scripts/check-spa-edge.sh) e as jornadas só de leitura (web/e2e/specs/vps.spec.ts) contra o
# site no ar, no Chromium e no Firefox. Só GET: nada muda na conta nem no servidor.
#
# Sem conta, rodam as jornadas anônimas. Com o secret E2E_VPS_API_KEY no environment production
# (chave só com runs:read e files:read, de uma conta de teste que já aceitou os termos), rodam
# também as que leem dados da conta; com o secret vazio, elas são puladas e o motivo fica no resumo.
#
# A chave só vai para a produção: a URL é fixa aqui, sem input de quem dispara (um input livre
# mandaria a chave para qualquer host), e o injectApiKey recusa outra origem. Na falha, sobe só o
# relatório HTML, sem traces nem test-results, que guardam os cabeçalhos com a chave.

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      E2E_VPS_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-vps
  cancel-in-progress: false

jobs:
  vps:
    name: Borda e jornadas de leitura
    runs-on: ubuntu-24.04
    # O environment dá acesso ao secret opcional; as regras de proteção dele valem aqui também.
    environment: production
    timeout-minutes: 15
    env:
      BASE_URL: https://goblinshift.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O job tem o secret da conta de teste: o token do GitHub não fica no .git.
          persist-credentials: false
      - name: Borda da SPA (cabeçalhos, cache, 404 e tipos)
        run: scripts/check-spa-edge.sh "$BASE_URL"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Chromium, Firefox e dependências do sistema
        run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - name: Conta de teste
        env:
          KEY: ${{ secrets.E2E_VPS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            msg="E2E_VPS_API_KEY vazio no environment production: só as jornadas anônimas rodam."
            echo "::notice title=Jornadas com conta puladas::$msg"
            echo "- $msg" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Jornadas de leitura
        working-directory: web
        env:
          E2E_VPS: "1"
          E2E_BASE_URL: https://goblinshift.dev
          GS_E2E_API_KEY: ${{ secrets.E2E_VPS_API_KEY }}
          CI: "1"
        # --trace off reforça a config do modo VPS: trace guarda os cabeçalhos dos pedidos.
        run: npx playwright test -c e2e --trace off
      - name: Relatório da falha (sem traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-vps
          path: web/playwright-report/
          retention-days: 7
