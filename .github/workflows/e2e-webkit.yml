name: Palco 3D (WebKit móvel)

# Só o palco, fora do job Chromium/notice de 12 min. Sem secrets, VPS ou deploy.
on:
  pull_request:
    paths:
      - "web/**"
      - "docker/nginx/snippets/spa-headers.conf"
      - ".github/workflows/e2e-webkit.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docker/nginx/snippets/spa-headers.conf"
      - ".github/workflows/e2e-webkit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    name: Palco em WebKit móvel
    # O WebKit usa a implementação WebGL do sistema: medir e exigir a capacidade, sem presumir
    # GPU no Linux nem disfarçar renderer software. O diagnóstico acompanha o relatório.
    runs-on: macos-15
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: WebKit fixado pelo Playwright do lockfile
        run: npx playwright install webkit
      - run: npm run build
      - name: Palco e contratos móveis (um worker, até quatro minutos)
        run: npm run e2e:webkit
      - name: Relatório, capacidade WebGL e traces de falhas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-webkit-stage
          path: |
            web/playwright-report-webkit/
            web/test-results-webkit/
          if-no-files-found: warn
          retention-days: 7
