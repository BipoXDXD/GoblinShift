name: Palco 3D (WebKit móvel)

# Fora do job Chromium/notice de 12 min do ci.yml, nos PRs que mexem na web: o palco em WebKit
# móvel e os defeitos plantados do e2e (web/e2e/sabotage.ts, issue #426), que levam de 7 a 15 min
# e dobrariam o job do ci.yml exigido pelo gate da release. Sem secrets, VPS ou deploy.
on:
  pull_request:
    paths:
      - "web/**"
      - "docker/nginx/snippets/spa-headers.conf"
      - ".github/workflows/e2e-webkit.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docker/nginx/snippets/spa-headers.conf"
      - ".github/workflows/e2e-webkit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    name: Palco em WebKit móvel
    # O WebKit usa a implementação WebGL do sistema: medir e exigir a capacidade, sem presumir
    # GPU no Linux nem disfarçar renderer software. O diagnóstico acompanha o relatório.
    runs-on: macos-15
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: WebKit fixado pelo Playwright do lockfile
        run: npx playwright install webkit
      - run: npm run build
      - name: Palco e contratos móveis (um worker, até quatro minutos)
        run: npm run e2e:webkit
      - name: Canário (chave de API nos artefatos)
        id: canario
        if: always()
        run: python3 ../scripts/verificar_artefatos_sem_chave.py playwright-report-webkit test-results-webkit
      - name: Relatório, capacidade WebGL e traces de falhas
        if: always() && steps.canario.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-webkit-stage
          path: |
            web/playwright-report-webkit/
            web/test-results-webkit/
          if-no-files-found: warn
          retention-days: 7

  sabotagem:
    name: Defeitos plantados derrubam as specs (Chromium)
    # Um `playwright test` por caso: 7 min num Mac local. O teto cobre runner lento e o pior caso
    # do apt (3 tentativas de 90 s).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Versão do Playwright (chave do cache do navegador)
        id: playwright
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Chromium headless e dependências do sistema
        timeout-minutes: 6
        env:
          DEBS: ${{ runner.temp }}/apt-debs
          CI_APT_TENTATIVA_S: "90"
        run: |
          lista=$(../scripts/ci-playwright-pacotes.sh chromium)
          if [[ -n $lista ]]; then
            mapfile -t pacotes <<<"$lista"
            ../scripts/ci-apt-instalar.sh "$DEBS" "${pacotes[@]}"
          fi
          npx playwright install --only-shell chromium
      # O sabotage.ts copia os dois builds; sem eles, ele falha pedindo o build.
      - name: Build
        run: npm run build
      - name: Build com o aviso global
        run: npm run build:notice-e2e
      - name: Cada defeito plantado derruba a spec que o vigia
        run: npm run e2e:sabotage
