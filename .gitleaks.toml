title = "Gitleaks do GoblinShift"

# Estende as regras padrão em vez de substituí-las: sem `useDefault`, um allowlist próprio
# desligaria em silêncio todas as regras embutidas (chaves privadas, tokens de nuvem etc.).
[extend]
useDefault = true

[[allowlists]]
description = "Valor ilustrativo de Idempotency-Key no exemplo de POST /api/v1/runs do plano (1.6)"
regexes = ['''^3f0c1b6e-6a2d-4c55-9a7e-2b1f8d4c9e10$''']
