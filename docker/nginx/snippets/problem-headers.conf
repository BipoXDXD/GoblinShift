# Cabeçalhos das respostas de erro que o próprio Nginx gera em problem+json (429, 413, 503), os
# mesmos que a API põe nas suas (src/goblinshift/entrypoints/api/security_headers.py). Incluído só
# nas locations de erro (@...): nas que encaminham à API, quem manda os cabeçalhos é ela, e
# repeti-los aqui os dobraria. Um add_header na location descarta os herdados, por isso o HSTS vem
# junto.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cache-Control no-store always;
add_header Strict-Transport-Security $hsts always;
