# Encaminhamento para a API, comum a todas as rotas do backend.
proxy_pass $api;
proxy_set_header Host $host;
# Só o IP real do cliente (já resolvido pelo real_ip), nunca a cadeia recebida: quem não é a
# borda não consegue injetar um IP forjado na API.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# O contexto de trace do cliente não chega à API: com ele, quem chama escolheria o trace_id que
# a Run grava e a que o span do worker liga (link), e um `traceparent` sem amostragem apagaria
# o evento amplo e os contadores dos alertas. A API também ignora esses cabeçalhos
# (configure_tracing).
proxy_set_header traceparent "";
proxy_set_header tracestate "";
proxy_set_header baggage "";
# Resposta maior que os buffers não vai para o `proxy_temp`: com a raiz só leitura, ele fica num
# `tmpfs` pequeno que conta na memória do contêiner (#442, R10). O Nginx repassa no ritmo do
# cliente, e a API sente a contrapressão.
proxy_max_temp_file_size 0;
add_header Strict-Transport-Security $hsts always;
