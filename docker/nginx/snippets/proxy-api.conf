# Encaminhamento para a API, comum a todas as rotas do backend.
proxy_pass $api;
proxy_set_header Host $host;
# Só o IP real do cliente (já resolvido pelo real_ip), nunca a cadeia recebida: quem não é a
# borda não consegue injetar um IP forjado na API.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
add_header Strict-Transport-Security $hsts always;
