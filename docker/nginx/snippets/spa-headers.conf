# Cabeçalhos dos arquivos da SPA (docs/GoblinShiftPlan.md, 3.6). Incluído em cada location de
# estáticos, porque um add_header dentro de uma location descarta os herdados do server.
# Sem 'unsafe-inline' nem 'unsafe-eval': o Vite gera só arquivos e o Zod roda com jitless.
# Para o GLB da abertura (ADR 030): 'wasm-unsafe-eval' deixa compilar o decoder Meshopt, um WASM
# embutido no chunk do three (não libera eval de JS); blob: em connect-src porque o GLTFLoader lê
# as texturas embutidas com fetch() de uma URL blob: criada pela própria página.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' blob:; img-src 'self' blob: data:; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Nenhum arquivo da SPA é recurso para outro site embutir. Os robôs de compartilhamento não são
# navegadores e não aplicam o cabeçalho.
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $hsts always;
