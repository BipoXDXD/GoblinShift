# Collector local: recebe OTLP da aplicação e repassa ao OpenObserve (docs/GoblinShiftPlan.md, 3.7).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  # Ocupação dos filesystems de tamanho fixo (3.8), para o alerta de disco acima de 85%
  # (deploy/openobserve/sql/causa-disco.sql). Na VPS, o compose.prod.yaml monta cada um em
  # /hostfs/<nome>, só leitura; sem as montagens (desenvolvimento), não sai métrica nenhuma.
  # Os pontos de montagem do container são as próprias montagens do host, então dispensa
  # root_path. Virtuais incluídos: não mudam nada na VPS e permitem o tmpfs dos testes.
  hostmetrics:
    collection_interval: ${env:GS_HOSTMETRICS_INTERVAL:-60s}
    scrapers:
      filesystem:
        include_virtual_filesystems: true
        include_mount_points:
          mount_points: [/hostfs/pg, /hostfs/storage, /hostfs/telemetry]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:OPENOBSERVE_BASIC_AUTH}"
      stream-name: default

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
