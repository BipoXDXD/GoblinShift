# Collector local: recebe OTLP da aplicação e repassa ao OpenObserve (docs/GoblinShiftPlan.md, 3.7).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        # Só com o token (#442, 31j): o Nginx também está na rede interna, e quem a alcança
        # injetaria spans e logs falsos nos alertas. Sem token ou com token errado: 401.
        auth:
          authenticator: bearertokenauth
        # Igual ao OTLP_MAX_REQUEST_BYTES do exporter (src/goblinshift/platform/telemetry.py):
        # 2048 spans de SQL com ~2 KB medem 4,3 MiB; 8 MiB dão folga de ~2x. Vale também para o
        # corpo descomprimido; acima dele, 400.
        max_request_body_size: 8388608
  # Ocupação dos filesystems de tamanho fixo (3.8), para o alerta de disco acima de 85%
  # (deploy/openobserve/sql/causa-disco.sql). Na VPS, o compose.prod.yaml monta cada um em
  # /hostfs/<nome>, só leitura; sem as montagens (desenvolvimento), não sai métrica nenhuma.
  # Os pontos de montagem do container são as próprias montagens do host, então dispensa
  # root_path. Virtuais incluídos: não mudam nada na VPS e permitem o tmpfs dos testes.
  hostmetrics:
    collection_interval: ${env:GS_HOSTMETRICS_INTERVAL:-60s}
    scrapers:
      filesystem:
        include_virtual_filesystems: true
        include_mount_points:
          mount_points: [/hostfs/pg, /hostfs/storage, /hostfs/telemetry]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      # Por arquivo (#442, 34a): variável de ambiente aparece no `docker inspect`. O `${file:}`
      # entra cru, com quebra de linha e tudo, e o Go recusa cabeçalho com `\n`: o arquivo é
      # gravado com `printf '%s'` (scripts/dev-secrets.sh).
      Authorization: "Basic ${file:/run/secrets/openobserve_basic_auth}"
      stream-name: default

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # O arquivo é relido quando muda; sem ele, o Collector não sobe.
  bearertokenauth:
    filename: /run/secrets/otlp_token

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
